conformance:
  - id: openapi
    conforms: true
    version: 3.0.0
    evidence: >-
      openapi/relevance-ai-openapi.json — 521 paths, 566 operations, 1,132 component schemas.
      Every operation carries a unique operationId, a summary and a description.
    ownership: >-
      Harvested from https://api-f1db6c.stack.tryrelevance.com/latest/openapi_schema.json, the
      spec URL named by the Scalar API reference at .../latest/documentation. The host is
      tryrelevance.com, not relevanceai.com, and that is correct rather than a mismatch:
      tryrelevance.com is Relevance AI's own API domain, hardcoded as the regional base in the
      company's own SDK source (RelevanceAI/relevance-js-sdk region.ts:
      `https://api-${region}.stack.tryrelevance.com`), and Relevance AI's own agent-skills
      repository links to https://api-f1db6c.stack.tryrelevance.com/latest/documentation as
      "API documentation — complete API reference". The spec says the same about itself:
      info.title "Relevance AI Endpoints", info.contact.email dev@tryrelevance.com. No sibling
      brand or third party is named anywhere in it.
  - id: oauth2
    conforms: true
    scope: MCP surface only
    evidence: >-
      https://mcp.relevanceai.com/.well-known/oauth-authorization-server declares
      authorization_code + refresh_token grants, PKCE S256, and a registration endpoint. The
      REST API itself uses a static apiKey header, not OAuth.
