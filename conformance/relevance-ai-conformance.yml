domain_standard:
  market: AI agent platforms / agentic automation
  assessment: >-
    This market's emerging interoperability standards are MCP (tool exposure), A2A (agent
    discovery) and the OpenTelemetry GenAI semantic conventions (agent observability).
    Relevance AI declares all three in its own artifacts rather than only in marketing prose:
    a live MCP server with RFC 8414/9728 metadata, a served A2A agent card, and gen_ai.*
    span attributes in its published telemetry contract. An observability or agent-ops buyer
    who already speaks OTEL GenAI can consume Relevance AI traces with no bespoke connector.
  declared:
    - standard: MCP
      evidence: live JSON-RPC endpoint at https://mcp.relevanceai.com/ + OAuth metadata documents
    - standard: A2A
      evidence: https://docs.relevanceai.com/.well-known/agent-card.json
    - standard: OpenTelemetry GenAI semantic conventions
      evidence: >-
        gen_ai.* span attribute namespace documented at
        https://relevanceai.com/docs/enterprise/streaming-events#supported-spans
  not_applicable:
    - 'Sector standards (FHIR, FAPI, PSD2, SCIM, OData, OpenRTB, LTI, HL7v2, ISO 20022): the
      provider is a horizontal agent platform, not a participant in a regulated vertical.'
