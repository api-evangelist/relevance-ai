provider: Relevance AI
providerId: relevance-ai
name: Relevance AI MCP Server
description: >-
  Relevance AI runs a first-party remote MCP server that exposes a project's agents, tools,
  workforces, knowledge tables, evals, analytics and triggers to any MCP-compatible client.
  It is a hosted HTTP (Streamable HTTP) endpoint with OAuth — not a local stdio package —
  so an agent can reach it directly once a human has consented.
status: published
deployment:
  mode: remote
  endpoint: https://mcp.relevanceai.com/
  auth: oauth
  verified: probed
  note: >-
    The provider also documents `npx -y mcp-remote https://mcp.relevanceai.com/` for clients
    that cannot speak HTTP MCP directly. That is a generic proxy shim in front of the SAME
    remote endpoint, not a Relevance-published stdio server, so mode stays `remote`. There is
    no relevance-ai MCP package on npm or PyPI.
transport: streamable-http
x-evidence:
  - url: https://mcp.relevanceai.com/
    method: 'POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
    http_status: 401
    body: '{"error":"invalid_token","error_description":"Missing Authorization header"}'
    www_authenticate: 'Bearer error="invalid_token", error_description="Missing Authorization header"'
    note: >-
      The endpoint is live and speaks MCP, but tools/list is auth-gated. The tool inventory
      below is therefore read from the provider's own published skill documentation, not from
      a live introspection; input schemas need an authenticated tools/list call.
  - url: https://mcp.relevanceai.com/.well-known/oauth-authorization-server
    http_status: 200
    file: well-known/relevance-ai-mcp-oauth-authorization-server.json
  - url: https://mcp.relevanceai.com/.well-known/oauth-protected-resource
    http_status: 200
    file: well-known/relevance-ai-mcp-oauth-protected-resource.json
authentication:
  type: oauth2
  flow: authorization_code
  pkce: S256
  dynamic_client_registration: true
  registration_endpoint: https://mcp.relevanceai.com/register
  authorization_endpoint: https://mcp.relevanceai.com/authorize
  token_endpoint: https://mcp.relevanceai.com/token
  revocation_endpoint: https://mcp.relevanceai.com/revoke
  scopes_supported:
    - claudeai
  scope: per-project
  note: >-
    OAuth consent binds the session to a single Relevance AI project. The consent screen also
    carries a Run-Only toggle for Member/Editor/Admin roles; Viewer and Chat roles are forced
    into restricted modes. Write and destructive tools are removed server-side in Run-Only
    mode, not merely hidden client-side.
access_control:
  enforcement: server-side, bounded by the caller's project role
  modes:
    - role: Admin
      mode: full access
      configurable: true
    - role: Editor
      mode: full access
      configurable: true
    - role: Member
      mode: full access
      configurable: true
    - role: Viewer
      mode: run-only
      configurable: false
    - role: Chat
      mode: chat
      configurable: false
execution_modes:
  - name: synchronous
    tool: relevance_trigger_agent
    timeout_seconds: 120
    note: Returns the agent result directly; documented for single-step agents only.
  - name: asynchronous
    tools:
      - relevance_trigger_agent_async
      - relevance_poll_agent_result
    timeout_seconds: null
    note: >-
      Trigger returns a conversation_id immediately; poll every 3-5 seconds until status is
      complete or failed. Documented as required for workforce nodes and multi-step chains.
clients_documented:
  - Claude Desktop
  - Claude Web
  - Claude Code
  - ChatGPT (Developer Mode)
  - Cursor
  - VS Code / Copilot
  - Windsurf
  - Codex
  - Zed
  - v0 by Vercel
plugin:
