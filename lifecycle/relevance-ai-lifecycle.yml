versioning:
  scheme: path-segment, single moving version
  current: latest
  detail: >-
    Every REST path is served under /latest and the OpenAPI declares info.version "latest".
    There is no dated or numbered API version, no version header, and no way for a caller to
    pin an older revision of the contract. The platform changelog is dated, but the API surface
    it describes is not versioned.
  spec_version_field: latest
  source: https://api-f1db6c.stack.tryrelevance.com/latest/openapi_schema.json
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations_in_spec: 0
  detail: >-
    No deprecation policy, no RFC 8594 Sunset/Deprecation headers, and not one operation in the
    566-operation spec carries `deprecated: true`. Deprecation is visible only in prose: the
    system-quotas page lists a "Tools (deprecated)" run-time class, the provider's own agent
    skill states that sub-agents in an agent's actions array are deprecated in favour of
    workforces, and the API returns an x-trace-id header whose value is the literal
    "x-trace-id-deprecated". None of that is a policy a consumer can plan against.
