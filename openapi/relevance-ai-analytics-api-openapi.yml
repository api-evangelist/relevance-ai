                            type:
                            - string
                            - 'null'
                          icon:
                            type:
                            - string
                            - 'null'
                          runs:
                            type: number
                            description: Count of runs
                          error_rate:
                            type: number
                            description: Fraction of tool runs that did not complete, in [0, 1]
                          actions:
                            type: number
                            description: Count of actions
                          credits:
                            type: number
                            description: Total credits consumed
                          credits_per_run:
                            type: number
                            description: credits / runs ratio. 0 when runs is 0.
                        required:
                        - entity_id
                        - name
                        - description
                        - icon
                        - runs
                        - error_rate
                        - actions
                        - credits
                        - credits_per_run
                        additionalProperties: false
                      description: Present only when the request `children=yes`. Per-tool rollups stitched at the agent grain — one entry per tool the agent invoked within this workforce over the window. Tool-grained children remain runs-keyed (primary metric per entity).
                  required:
                  - entity_id
                  - name
                  - description
                  - icon
                  - tasks
                  - error_rate
                  - actions
                  - credits
                  - credits_per_task
                  additionalProperties: false
                description: Present only when the request `children=yes`. Per-agent rollups stitched at the workforce grain. Each agent child may carry its own nested `children` array of per-tool rollups (the full workforce -> agent -> tool tree).
            required:
            - entity_id
            - name
            - description
            - icon
            - tasks
            - error_rate
            - actions
            - credits
            - credits_per_task
            additionalProperties: false
        totals:
          type: object
          properties:
            grand:
              type: object
              properties:
                tasks:
                  type: number
                  description: Count of tasks (the workforce orchestration unit; workforce primary metric)
                actions:
                  type: number
                  description: Count of actions
                agent_model_credits:
                  type: number
                  description: Credits consumed by agents' own model calls inside the selected workforces. Pairs with tool_credits (disjoint; mirrors project-level semantics so workforce/agent/tool credits aren't double-counted).
                tool_credits:
                  type: number
                  description: Credits consumed by tools run inside the selected workforces. Pairs with agent_model_credits.
                credits_per_task:
                  type: number
                  description: (agent_model_credits + tool_credits) / tasks ratio. 0 when tasks is 0.
                error_rate:
                  type: number
                  description: Fraction of tasks not completed (workforce success = state_completed only; no state_idle exists at the workforce level), in [0, 1]; 0 when tasks is 0
              required:
              - tasks
              - actions
              - agent_model_credits
              - tool_credits
              - credits_per_task
              - error_rate
              additionalProperties: false
          required:
          - grand
          additionalProperties: false
      required:
      - meta
      - rows
      - totals
      additionalProperties: false
    GetToolUsageTimeseriesInput:
      type: object
      properties:
        start_date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive start date (YYYY-MM-DD)
        end_date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive end date (YYYY-MM-DD)
        tool_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
          maxItems: 1000
          description: Optional list of tool display IDs to filter by. Duplicates are ignored. Maximum 1000 IDs.
      required:
      - start_date
      - end_date
      additionalProperties: false
    GetAgentUsageTimeseriesInput:
      type: object
      properties:
        start_date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive start date (YYYY-MM-DD)
        end_date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
          description: Inclusive end date (YYYY-MM-DD)
        agent_ids:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 256
          maxItems: 1000
          description: Optional list of agent display IDs to filter by. Duplicates are ignored. Maximum 1000 IDs.
      required:
      - start_date
      - end_date
      additionalProperties: false
  securitySchemes:
    AuthorizationHeader:
      type: apiKey
      in: header
