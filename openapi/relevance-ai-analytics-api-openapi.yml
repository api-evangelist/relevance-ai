openapi: 3.2.0
info:
  description: Relevance AI Endpoints
  title: Relevance AI Endpoints Analytics API
  version: latest
  contact:
    email: dev@tryrelevance.com
servers:
- url: /latest
security:
- AuthorizationHeader:
  - Authorization
tags:
- name: Analytics
paths:
  /analytics/get_metrics:
    post:
      summary: GetMetrics
      tags:
      - Analytics
      description: 'Get metrics data with time-series points and summary statistics


        ### Required permissions

        > []'
      operationId: GetMetrics
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetMetricsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetricsOutput'
  /analytics/get_agent_breakdown:
    post:
      summary: GetAgentBreakdown
      tags:
      - Analytics
      description: 'Get agent breakdown data with task counts, error rates, and top actions


        ### Required permissions

        > []'
      operationId: GetAgentBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAgentBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentBreakdownOutput'
  /analytics/get_action_breakdown:
    post:
      summary: GetActionBreakdown
      tags:
      - Analytics
      description: 'Get action breakdown data with execution counts, credits used, and top agents


        ### Required permissions

        > []'
      operationId: GetActionBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActionBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetActionBreakdownOutput'
  /analytics/get_workforce_breakdown:
    post:
      summary: GetWorkforceBreakdown
      tags:
      - Analytics
      description: 'Get workforce breakdown data with task counts, error rates, credits used, and top agents


        ### Required permissions

        > []'
      operationId: GetWorkforceBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetWorkforceBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkforceBreakdownOutput'
  /analytics/get_agent_llm_usage_by_model:
    post:
      summary: GetAgentModelBreakdown
      tags:
      - Analytics
      description: 'Get agent usage breakdown by LLM model with credits and input/output token sums


        ### Required permissions

        > []'
      operationId: GetAgentModelBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAgentModelBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentModelBreakdownOutput'
  /analytics/get_agent_errors:
    post:
      summary: GetAgentErrors
      tags:
      - Analytics
      description: 'Get error messages from agents and tool runs within a time range


        ### Required permissions

        > []'
      operationId: GetAgentErrors
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAgentErrorsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentErrorsOutput'
  /analytics/get_error_time_series:
    get:
      summary: GetErrorTimeSeries
      tags:
      - Analytics
      description: 'Get detailed error records with full execution context


        ### Required permissions

        > []'
      operationId: GetErrorTimeSeries
      parameters:
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
        description: ''
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
        description: ''
      - in: query
        name: agent_ids
        schema:
          type: array
          items:
            type: string
        description: ''
      - in: query
        name: workforce_ids
        schema:
          type: array
          items:
            type: string
        description: ''
      - in: query
        name: source_filter
        schema:
          type: string
          enum:
          - all
          - workforce
          - agent
          - tool
          description: 'Filter errors by source type: all (no filter), workforce (only errors from workforce tasks), agent (agent conversation errors), tool (tool execution errors)'
        description: 'Filter errors by source type: all (no filter), workforce (only errors from workforce tasks), agent (agent conversation errors), tool (tool execution errors)'
      - in: query
        name: page_size
        schema:
          type: number
          minimum: 1
          maximum: 100
          default: 20
        description: ''
      - in: query
        name: cursor
        schema:
          type: string
        description: ''
      - in: query
        name: timezone
        schema:
          type: string
          minLength: 1
          maxLength: 64
          description: IANA timezone identifier (e.g., 'America/New_York', 'Europe/London'). Used for date aggregation in charts.
        description: IANA timezone identifier (e.g., 'America/New_York', 'Europe/London'). Used for date aggregation in charts.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetErrorTimeSeriesOutput'
  /analytics/get_task_timeline:
    get:
      summary: GetTaskTimeline
      tags:
      - Analytics
      description: 'Get day-bucketed counts for one of the Tasks page tab timelines — `view` picks Approvals, Escalated, or Errored. Auth matches ListConversations so any project member viewing the tab can also see the chart.


        ### Required permissions

        > [

        {

        "actions": [

        "agents:read",

        "knowledge_sets:read"

        ]

        }

        ]'
      operationId: GetTaskTimeline
      parameters:
      - in: query
        name: view
        schema:
          type: string
          enum:
          - approvals
          - escalated
          - errored
          description: 'Which tab''s timeline to fetch counts for: ''approvals'' (pending-approval conversations — the Approvals tab), ''escalated'' (conversations currently in the escalated state), or ''errored'' (conversations in an errored state with active failures).'
        description: 'Which tab''s timeline to fetch counts for: ''approvals'' (pending-approval conversations — the Approvals tab), ''escalated'' (conversations currently in the escalated state), or ''errored'' (conversations in an errored state with active failures).'
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
          description: Inclusive start of the time range, UTC ISO 8601 format (e.g., '2024-01-15T09:00:00Z').
        description: Inclusive start of the time range, UTC ISO 8601 format (e.g., '2024-01-15T09:00:00Z').
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
          description: Inclusive end of the time range, UTC ISO 8601 format (e.g., '2024-01-15T09:00:00Z').
        description: Inclusive end of the time range, UTC ISO 8601 format (e.g., '2024-01-15T09:00:00Z').
      - in: query
        name: agent_ids
        schema:
          type: array
          items:
            type: string
            maxLength: 128
          maxItems: 100
        description: ''
      - in: query
        name: timezone
        schema:
          type: string
          maxLength: 64
          description: IANA timezone identifier (e.g., 'America/New_York', 'Europe/London'). Used for date aggregation in charts.
        description: IANA timezone identifier (e.g., 'America/New_York', 'Europe/London'). Used for date aggregation in charts.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskTimelineOutput'
  /organizations/{organization_id}/analytics/concurrency_time_series:
    get:
      summary: GetConcurrencyTimeSeriesByOrgId
      tags:
      - Analytics
      description: 'Get concurrency usage time-series data for an organization (canonical org-scoped path)


        ### Required permissions

        > []'
      operationId: GetConcurrencyTimeSeriesByOrgId
      parameters:
      - name: organization_id
        in: path
        description: ID of organization
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - in: query
        name: start_date
        schema:
          type: string
          format: date-time
          description: Start date for the query (ISO 8601 format)
        description: Start date for the query (ISO 8601 format)
      - in: query
        name: end_date
        schema:
          type: string
          format: date-time
          description: End date for the query (ISO 8601 format)
        description: End date for the query (ISO 8601 format)
      - in: query
        name: granularity
        schema:
          type: string
          enum:
          - 15m
          - 4h
          - 1d
          description: Time bucket granularity
        description: Time bucket granularity
      - in: query
        name: aggregation
        schema:
          type: string
          enum:
          - max
          - avg
          default: max
          description: Aggregation function applied within each bucket. Defaults to max
        description: Aggregation function applied within each bucket. Defaults to max
      - in: query
        name: project_id
        schema:
          type: string
          description: Optional project ID to filter by. Not yet supported — returns 400 if set
        description: Optional project ID to filter by. Not yet supported — returns 400 if set
      - in: query
        name: group_by
        schema:
          type: string
          enum:
          - project
          description: Split the concurrency series per project when set to "project".
        description: Split the concurrency series per project when set to "project".
      - in: query
        name: detail_scope
        schema:
          type: string
          enum:
          - organization
          - current_project
          description: Requested detail scope for the per-project breakdown. Org admins receive full per-project detail; other callers only receive full detail for detail_project_id, with every other project anonymised into a single bucket. The server clamps this to the caller's role, so it can only narrow what is returned.
        description: Requested detail scope for the per-project breakdown. Org admins receive full per-project detail; other callers only receive full detail for detail_project_id, with every other project anonymised into a single bucket. The server clamps this to the caller's role, so it can only narrow what is returned.
      - in: query
        name: detail_project_id
        schema:
          type: string
          minLength: 1
          description: Project display ID that can receive full detail in the per-project breakdown when detail_scope is current_project.
        description: Project display ID that can receive full detail in the per-project breakdown when detail_scope is current_project.
      - in: query
        name: timezone
        schema:
          type: string
          description: IANA timezone identifier (e.g., 'America/New_York', 'Europe/London'). Used for date aggregation in charts.
        description: IANA timezone identifier (e.g., 'America/New_York', 'Europe/London'). Used for date aggregation in charts.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetConcurrencyTimeSeriesByOrgIdOutput'
  /organizations/{organization_id}/analytics/live_jobs:
    get:
      summary: GetLiveJobsByOrgId
      tags:
      - Analytics
      description: 'Get live scheduler-backed running and queued jobs for an organization


        ### Required permissions

        > []'
      operationId: GetLiveJobsByOrgId
      parameters:
      - name: organization_id
        in: path
        description: ID of organization
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - in: query
        name: cursor
        schema:
          type: string
          description: Opaque pagination cursor from the previous response
        description: Opaque pagination cursor from the previous response
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 500
          description: Maximum live jobs to return. Defaults to 100
        description: Maximum live jobs to return. Defaults to 100
      - in: query
        name: state
        schema:
          type: string
          enum:
          - running
          - queued
          description: Restrict the returned page to one state. Counts in metadata stay organization-wide and unfiltered. Omitted returns both, interleaved in dispatch order
        description: Restrict the returned page to one state. Counts in metadata stay organization-wide and unfiltered. Omitted returns both, interleaved in dispatch order
      - in: query
        name: priority_tier
        schema:
          type: string
          enum:
          - high
          - medium
          - low
          - untiered
          description: Restrict the returned page to one priority tier, 'untiered' included. Counts in metadata stay organization-wide and unfiltered, as with state. Omitted returns every tier
        description: Restrict the returned page to one priority tier, 'untiered' included. Counts in metadata stay organization-wide and unfiltered, as with state. Omitted returns every tier
      - in: query
        name: detail_scope
        schema:
          type: string
          enum:
          - organization
          - current_project
          description: Whether to return organization-wide full detail or only full detail for the current project
        description: Whether to return organization-wide full detail or only full detail for the current project
      - in: query
        name: detail_project_id
        schema:
          type: string
          description: Project display ID that can receive full row detail when detail_scope is current_project
        description: Project display ID that can receive full row detail when detail_scope is current_project
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetLiveJobsByOrgIdOutput'
  /task_ops/tab_counts:
    get:
      summary: GetTaskOpsTabCounts
      tags:
      - Analytics
      description: 'Get the built-in TaskOps tab counts (Approvals, Escalated, Errors, All tasks) in a single response.


        ### Required permissions

        > [

        {

        "actions": [

        "agents:read",

        "knowledge_sets:read"

        ]

        }

        ]'
      operationId: GetTaskOpsTabCounts
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskOpsTabCountsOutput'
  /analytics/get_usage:
    get:
      summary: GetUsage
      tags:
      - Analytics
      description: 'Get usage data from agents and tool runs within a time range


        ### Required permissions

        > []'
      operationId: GetUsage
      parameters:
      - in: query
        name: group
        schema:
          type: string
          enum:
          - user
          - agent
          - tool
          - workforce
          description: The actor associated with the usage
        description: The actor associated with the usage
      - in: query
        name: metric
        schema:
          type: string
          enum:
          - credit
          - action
          description: The metric to be measured
        description: The metric to be measured
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: ''
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsageOutput'
  /analytics/tool/breakdown:
    post:
      summary: GetToolUsageBreakdown
      tags:
      - Analytics
      description: 'Per-tool totals across the date range. Returns `{ meta, rows, totals.grand }` — one row per tool (entity_id + metadata + runs/actions/credits/credits_per_run/error_rate) ordered by runs DESC.


        ### Required permissions

        > []'
      operationId: GetToolUsageBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetToolUsageBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToolUsageBreakdownOutput'
  /analytics/tool/breakdown/timeseries:
    post:
      summary: GetToolUsageBreakdownTimeseries
      tags:
      - Analytics
      description: 'Per-(tool, day) usage zero-filled across the date range. Returns `{ meta, entities, series, totals }` — `entities` carries per-tool metadata + totals (uncapped), `series` is long-format `(entity_id, date, ...)` chart rows capped at the top 1000 tools by run volume, `totals.by_date` is per-day rollups across the capped `series` only. For projects with >1000 tools the caps diverge: `totals.grand` covers all entities while `totals.by_date` and `series` cover only the top 1000, so `sum(totals.by_date.runs) []'
      operationId: GetToolUsageBreakdownTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetToolUsageBreakdownTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToolUsageBreakdownTimeseriesOutput'
  /analytics/tool/timeseries:
    post:
      summary: GetToolUsageTimeseries
      tags:
      - Analytics
      description: 'Per-day usage across selected tools (default = all), zero-filled across the date range. Returns `{ meta, rows, totals.grand }` — `rows` ordered by date ASC, one per day with combined runs/actions/credits/error_rate.


        ### Required permissions

        > []'
      operationId: GetToolUsageTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetToolUsageTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToolUsageTimeseriesOutput'
  /analytics/agent/breakdown:
    post:
      summary: GetAgentUsageBreakdown
      tags:
      - Analytics
      description: 'Per-agent totals across the date range. Returns `{ meta, rows, totals.grand }` — one row per agent (entity_id + metadata + tasks/actions/credits/credits_per_task/error_rate) ordered by tasks DESC. When `children=yes`, each row carries a `children` array of per-tool rollups stitched at the agent grain (tool-grained children remain runs-keyed since primary metrics are per-entity).


        ### Required permissions

        > []'
      operationId: GetAgentUsageBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAgentUsageBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentUsageBreakdownOutput'
  /analytics/agent/breakdown/timeseries:
    post:
      summary: GetAgentUsageBreakdownTimeseries
      tags:
      - Analytics
      description: 'Per-(agent, day) usage zero-filled across the date range. Returns `{ meta, entities, series, totals }` — `entities` carries per-agent metadata + totals (uncapped), `series` is long-format `(entity_id, date, ...)` chart rows capped at the top 1000 agents by task volume, `totals.by_date` is per-day rollups across the capped `series` only. For projects with >1000 agents the caps diverge: `totals.grand` covers all entities while `totals.by_date` and `series` cover only the top 1000, so `sum(totals.by_date.tasks) []'
      operationId: GetAgentUsageBreakdownTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAgentUsageBreakdownTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentUsageBreakdownTimeseriesOutput'
  /analytics/agent/timeseries:
    post:
      summary: GetAgentUsageTimeseries
      tags:
      - Analytics
      description: 'Per-day agent usage across selected agents (default = all), zero-filled across the date range. Returns `{ meta, rows, totals.grand }` — `rows` ordered by date ASC, one per day with combined tasks/actions/agent_model_credits/tool_credits/error_rate (sum the two credit columns client-side for a full credit total).


        ### Required permissions

        > []'
      operationId: GetAgentUsageTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAgentUsageTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAgentUsageTimeseriesOutput'
  /analytics/workforce/breakdown:
    post:
      summary: GetWorkforceUsageBreakdown
      tags:
      - Analytics
      description: 'Per-workforce totals across the date range. Returns `{ meta, rows, totals.grand }` — one row per workforce (entity_id + metadata + tasks/actions/credits/credits_per_task/error_rate) ordered by tasks DESC. `error_rate` counts only `state_completed` as success (state_idle does not apply to workforces, unlike agents). When `children=yes`, each row carries a `children` array of per-agent rollups (each with its own per-tool `children` array) stitched at the workforce grain — the full workforce -> agent -> tool tree. Agent-grained children remain tasks-keyed and tool-grained children remain runs-keyed (primary metrics are per-entity).


        ### Required permissions

        > []'
      operationId: GetWorkforceUsageBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetWorkforceUsageBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkforceUsageBreakdownOutput'
  /analytics/workforce/breakdown/timeseries:
    post:
      summary: GetWorkforceUsageBreakdownTimeseries
      tags:
      - Analytics
      description: 'Per-(workforce, day) usage zero-filled across the date range. Returns `{ meta, entities, series, totals }` — `entities` carries per-workforce metadata + totals (uncapped), `series` is long-format `(entity_id, date, ...)` chart rows capped at the top 1000 workforces by task volume, `totals.by_date` is per-day rollups across the capped `series` only. For projects with >1000 workforces the caps diverge: `totals.grand` covers all entities while `totals.by_date` and `series` cover only the top 1000, so `sum(totals.by_date.tasks) []'
      operationId: GetWorkforceUsageBreakdownTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetWorkforceUsageBreakdownTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkforceUsageBreakdownTimeseriesOutput'
  /analytics/workforce/timeseries:
    post:
      summary: GetWorkforceUsageTimeseries
      tags:
      - Analytics
      description: 'Per-day workforce usage across selected workforces (default = all), zero-filled across the date range. Returns `{ meta, rows, totals.grand }` — `rows` ordered by date ASC, one per day with combined tasks/actions/agent_model_credits/tool_credits/error_rate (sum the two credit columns client-side for a full credit total).


        ### Required permissions

        > []'
      operationId: GetWorkforceUsageTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetWorkforceUsageTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkforceUsageTimeseriesOutput'
  /analytics/project/timeseries:
    post:
      summary: GetProjectUsageTimeseries
      tags:
      - Analytics
      description: 'Per-day project-wide usage, zero-filled across the date range. Returns `{ meta, rows, totals.grand }` with agent_tasks, workforce_tasks, tool_runs, actions, and two credit columns: `tool_credits` (tool execution incl. AI model calls made inside tools) and `agent_model_credits` (agents'' own AI model calls). Workforce credits are excluded to avoid double-counting; sum the two columns client-side for a full credit total.


        ### Required permissions

        > []'
      operationId: GetProjectUsageTimeseries
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetProjectUsageTimeseriesInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectUsageTimeseriesOutput'
  /analytics/model/breakdown:
    post:
      summary: GetModelUsageBreakdown
      tags:
      - Analytics
      description: 'Per-(model, context) AI model usage across the date range, where `context` labels where each call occurred in the workforce/agent/tool tree (six buckets: tool, agent_model, agent_tool, workforce_tool, workforce_agent_tool, workforce_agent_model). Returns `{ meta, rows, totals }` — `rows` ordered by credits DESC, model ASC, context ASC; `totals.by_context` collapses model out for per-context subtotals (contexts with zero usage are omitted); `totals.grand` sums across the whole window. Filter via `model_ids` and/or `contexts`.


        ### Required permissions

        > []'
      operationId: GetModelUsageBreakdown
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetModelUsageBreakdownInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetModelUsageBreakdownOutput'
components:
  schemas:
    GetModelUsageBreakdownOutput:
      type: object
      properties:
        meta:
          type: object
          properties:
            start_date:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Inclusive start of the data range covered by this response (as specified by the request)
            end_date:
              type: string
              format: date
              pattern: ^\d{4}-\d{2}-\d{2}$
              description: Inclusive end of the data range covered by this response (as specified by the request)
            interval:
              type: string
              enum:
              - day
              - total
