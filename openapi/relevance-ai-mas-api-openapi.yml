openapi: 3.2.0
info:
  description: Relevance AI Endpoints
  title: Relevance AI Endpoints Mas API
  version: latest
  contact:
    email: dev@tryrelevance.com
servers:
- url: /latest
security:
- AuthorizationHeader:
  - Authorization
tags:
- name: Mas
paths:
  /mas/items/{document_id}/get:
    get:
      summary: GetMAS
      tags:
      - Mas
      description: '### Required permissions

        > []'
      operationId: GetMAS
      parameters:
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - in: query
        name: select_fields
        schema:
          type: array
          items:
            type: string
          description: Fields to include in the search results, empty array/list means all fields.
        description: Fields to include in the search results, empty array/list means all fields.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMASOutput'
  /mas/items/{document_id}:
    delete:
      summary: DeleteMAS
      tags:
      - Mas
      description: '### Required permissions

        > []'
      operationId: DeleteMAS
      parameters:
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMASInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMASOutput'
  /mas/list:
    post:
      summary: ListMAS
      tags:
      - Mas
      description: '### Required permissions

        > []'
      operationId: ListMAS
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListMASInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMASOutput'
  /mas/items/{document_id}/upsert:
    post:
      summary: UpsertMAS
      tags:
      - Mas
      description: '### Required permissions

        > []'
      operationId: UpsertMAS
      parameters:
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMASInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertMASOutput'
