      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectSettingsOutput'
  /projects/mcp/upsert:
    post:
      summary: UpsertProjectMCPServer
      tags:
      - Projects
      description: 'Create or update a project-level MCP server configuration. Upserts by URL - if an MCP server with the same URL exists for the project, it will be updated; otherwise, a new one will be created.


        ### Required permissions

        > []'
      operationId: UpsertProjectMCPServer
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectMCPServerInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertProjectMCPServerOutput'
  /projects/mcp/list:
    post:
      summary: ListProjectMCPServers
      tags:
      - Projects
      description: 'List all MCP server configurations for the project. Returns display_id, label, url, authentication_type, and auth_details for each server.


        ### Required permissions

        > []'
      operationId: ListProjectMCPServers
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListProjectMCPServersInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectMCPServersOutput'
  /projects/mcp/delete:
    post:
      summary: DeleteProjectMCPServer
      tags:
      - Projects
      description: 'Delete a project-level MCP server configuration by display_id. Returns success: true if deleted, or throws an error if not found.


        ### Required permissions

        > []'
      operationId: DeleteProjectMCPServer
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectMCPServerInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectMCPServerOutput'
  /projects/mcp/get:
    post:
      summary: GetProjectMCPServer
      tags:
      - Projects
      description: 'Get a project-level MCP server configuration by display_id. Returns display_id, label, url, authentication_type, and auth_details.


        ### Required permissions

        > []'
      operationId: GetProjectMCPServer
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetProjectMCPServerInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectMCPServerOutput'
  /assets/{asset_type}/{asset_id}/access_configuration:
    get:
      summary: GetAssetAccessConfiguration
      tags:
      - Projects
      description: 'Get the general access configuration for an asset. Returns the access level (only_invited or everyone_in_project) and the associated role if applicable.


        ### Required permissions

        > []'
      operationId: GetAssetAccessConfiguration
      parameters:
      - name: asset_type
        in: path
        description: ID of asset_type
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: asset_id
        in: path
        description: ID of asset
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAssetAccessConfigurationOutput'
    post:
      summary: SetAssetAccessConfiguration
      tags:
      - Projects
      description: 'Set the general access configuration for an asset. When access_level is "everyone_in_project", grants all project members the specified role. When access_level is "only_invited", revokes all general access and restricts to only explicitly invited users. Requires admin permissions on the asset.


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ]

        }

        ]'
      operationId: SetAssetAccessConfiguration
      parameters:
      - name: asset_type
        in: path
        description: ID of asset_type
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: asset_id
        in: path
        description: ID of asset
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetAssetAccessConfigurationInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetAssetAccessConfigurationOutput'
  /job-priorities/list:
    get:
      summary: ListEntityJobPriorities
      tags:
      - Projects
      description: 'List all entity job priority tiers set for the current project.


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ]

        }

        ]'
      operationId: ListEntityJobPriorities
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEntityJobPrioritiesOutput'
  /job-priorities/set:
    post:
      summary: SetEntityJobPriority
      tags:
      - Projects
      description: 'Set (create or update) the priority tier for an agent, tool or workforce in the current project.


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ]

        }

        ]'
      operationId: SetEntityJobPriority
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetEntityJobPriorityInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetEntityJobPriorityOutput'
  /job-priorities/unset:
    post:
      summary: UnsetEntityJobPriority
      tags:
      - Projects
      description: 'Unset (delete) the priority tier for an agent, tool or workforce in the current project, reverting it to the Medium default.


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ]

        }

        ]'
      operationId: UnsetEntityJobPriority
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsetEntityJobPriorityInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsetEntityJobPriorityOutput'
components:
  schemas:
    GetIsProjectBlockingOnUsageAlarmsOutput:
      type: object
      properties:
        organization_credit_breach:
          type: boolean
        organization_action_breach:
          type: boolean
        project_credit_breach:
          type: boolean
        project_action_breach:
          type: boolean
      required:
      - organization_credit_breach
      - organization_action_breach
      - project_credit_breach
      - project_action_breach
      additionalProperties: false
    SetProjectKeyInput:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
      additionalProperties: false
      required:
      - key
      - value
    SetEntityJobPriorityInput:
      type: object
      properties:
        priority_entity:
          type: string
          enum:
          - agent
          - tool
          - workforce
          description: 'Which kind of builder entity this priority applies to: an Agent, a Tool or a Workforce.'
        entity_id:
          type: string
          minLength: 1
          description: Display id of the Agent / Tool / Workforce to prioritise. Must be a real entity of the given type in this project.
        priority_tier:
