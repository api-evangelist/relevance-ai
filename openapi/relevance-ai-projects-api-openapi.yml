      summary: UpsertProjectSnippet
      tags:
      - Projects
      description: 'Upsert a project snippet


        ### Required permissions

        > [

        {

        "actions": [

        "datasets:write"

        ],

        "datasets": [

        {

        "raw": "*"

        }

        ]

        }

        ]'
      operationId: UpsertProjectSnippet
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectSnippetInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertProjectSnippetOutput'
  /projects/snippets/list:
    get:
      summary: ListProjectSnippets
      tags:
      - Projects
      description: 'Gets the snippets for a project


        ### Required permissions

        > []'
      operationId: ListProjectSnippets
      parameters:
      - in: query
        name: include_references
        schema:
          type: boolean
          description: Whether to fetch the references of the snippets as part of the response
          default: false
        description: Whether to fetch the references of the snippets as part of the response
      - in: query
        name: page_size
        schema:
          type: number
          default: 20
        description: ''
      - in: query
        name: page_number
        schema:
          type: number
          default: 0
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectSnippetsOutput'
  /projects/snippets/delete:
    post:
      summary: DeleteProjectSnippet
      tags:
      - Projects
      description: 'Delete a project snippet


        ### Required permissions

        > [

        {

        "actions": [

        "datasets:write"

        ],

        "datasets": [

        {

        "raw": "*"

        }

        ]

        }

        ]'
      operationId: DeleteProjectSnippet
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectSnippetInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectSnippetOutput'
  /projects/{project_id}/delete_job:
    post:
      summary: CreateProjectDeleteJob
      tags:
      - Projects
      description: 'Create a job to delete all resources associated with a project and then delete the project


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ],

        "projects": [

        {

        "params": "project_id"

        }

        ]

        }

        ]'
      operationId: CreateProjectDeleteJob
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectDeleteJobInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectDeleteJobOutput'
    get:
      summary: GetProjectDeletionMetadata
      tags:
      - Projects
      description: 'Get the id of the latest project delete job for a project, along with counts of resources in the project


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ],

        "projects": [

        {

        "params": "project_id"

        }

        ]

        }

        ]'
      operationId: GetProjectDeletionMetadata
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectDeletionMetadataOutput'
  /projects/delete_job/{project_deletion_job_id}:
    get:
      summary: GetProjectDeleteJob
      tags:
      - Projects
      description: 'Get the project delete job by ID, along with counts of remaining resources in the project if it still exists


        ### Required permissions

        > []'
      operationId: GetProjectDeleteJob
      parameters:
      - name: project_deletion_job_id
        in: path
        description: ID of project_deletion_job
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectDeleteJobOutput'
  /projects/{project_id}/usage-alarms/list:
    get:
      summary: ListProjectUsageAlarms
      tags:
      - Projects
      description: 'List all usage alarms for the current project


