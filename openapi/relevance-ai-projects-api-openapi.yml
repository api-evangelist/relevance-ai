            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectUsageAlarmsOutput'
  /projects/{project_id}/usage-alarms/upsert:
    post:
      summary: UpsertProjectUsageAlarm
      tags:
      - Projects
      description: 'Create or update a usage alarm for the current project


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ],

        "projects": [

        {

        "params": "project_id"

        }

        ]

        }

        ]'
      operationId: UpsertProjectUsageAlarm
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertProjectUsageAlarmInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertProjectUsageAlarmOutput'
  /projects/{project_id}/usage-alarms/delete:
    post:
      summary: DeleteProjectUsageAlarm
      tags:
      - Projects
      description: 'Delete a usage alarm for the current project


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ],

        "projects": [

        {

        "params": "project_id"

        }

        ]

        }

        ]'
      operationId: DeleteProjectUsageAlarm
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectUsageAlarmInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
