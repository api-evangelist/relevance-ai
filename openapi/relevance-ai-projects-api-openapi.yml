openapi: 3.2.0
info:
  description: Relevance AI Endpoints
  title: Relevance AI Endpoints Projects API
  version: latest
  contact:
    email: dev@tryrelevance.com
servers:
- url: /latest
security:
- AuthorizationHeader:
  - Authorization
tags:
- name: Projects
paths:
  /projects/create:
    post:
      summary: CreateProject
      tags:
      - Projects
      description: 'Create a new Project that your user will have access to


        ### Required permissions

        > [

        {

        "actions": [

        "organizations:write"

        ],

        "organizations": [

        {

        "body": "organization_id"

        }

        ]

        }

        ]'
      operationId: CreateProject
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateProjectOutput'
  /projects/update:
    post:
      summary: UpdateProject
      tags:
      - Projects
      description: 'Update metadata of a Project


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ]

        }

        ]'
      operationId: UpdateProject
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectOutput'
  /projects/list:
    get:
      summary: ListProjects
      tags:
      - Projects
      description: 'List all projects and their metadata


        ### Required permissions

        > []'
      operationId: ListProjects
      parameters:
      - in: query
        name: page
        schema:
          type: number
        description: ''
      - in: query
        name: page_size
        schema:
          type: number
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectsOutput'
  /projects/organization_info:
    get:
      summary: GetProjectsOrgInfo
      tags:
      - Projects
      description: '### Required permissions

        > [

        {

        "actions": [

        "datasets:write"

        ]

        }

        ]'
      operationId: GetProjectsOrgInfo
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectsOrgInfoOutput'
  /projects/keys/list:
    get:
      summary: ListProjectKeys
      tags:
      - Projects
      description: 'List which keys exist for a project


        ### Required permissions

        > []'
      operationId: ListProjectKeys
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectKeysOutput'
  /projects/keys/availability:
    get:
      summary: ListProjectNativeApiKeysAvailability
