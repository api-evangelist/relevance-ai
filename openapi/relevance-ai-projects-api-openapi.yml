        "datasets": [

        {

        "raw": "*"

        }

        ]

        }

        ]'
      operationId: DeleteProjectKey
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteProjectKeyInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteProjectKeyOutput'
  /projects/snippets/upsert:
