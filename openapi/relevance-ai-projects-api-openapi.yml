        "actions": [

        "role:reader"

        ]

        }

        ]'
      operationId: GetProjectSetting
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: setting_id
        in: path
        description: ID of setting
        required: true
        schema:
          type: string
          maxLength: 240
