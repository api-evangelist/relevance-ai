      - Projects
      description: 'List API key availability for a project including organization-level fallback keys.


        ### Required permissions

        > []'
      operationId: ListProjectNativeApiKeysAvailability
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectNativeApiKeysAvailabilityOutput'
  /projects/keys/types/list:
    get:
      summary: ListProjectKeyTypes
      tags:
      - Projects
      description: 'List all valid Project key types


        ### Required permissions

        > []'
      operationId: ListProjectKeyTypes
      parameters:
      - in: query
        name: tags
        schema:
          type: string
          description: Comma-separated list of tags to filter by
        description: Comma-separated list of tags to filter by
      - in: query
        name: include_tags
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          description: Set to 'true' to include tags in the response
        description: Set to 'true' to include tags in the response
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProjectKeyTypesOutput'
  /projects/keys/set:
    post:
      summary: SetProjectKey
      tags:
      - Projects
      description: 'Set a key for a project


        ### Required permissions

        > [

        {

        "actions": [

        "datasets:write"

        ],

        "datasets": [

        {

        "raw": "*"

        }

        ]

        }

        ]'
      operationId: SetProjectKey
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProjectKeyInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetProjectKeyOutput'
  /projects/keys/delete:
