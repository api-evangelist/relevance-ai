      - Projects
      description: 'Check if the project or the organization the project is in is currently blocking actions due to usage alarms


        ### Required permissions

        > [

        {

        "actions": [

        "role:reader"

        ],

        "projects": [

        {

        "params": "project_id"

        }

        ]

        }

        ]'
      operationId: GetIsProjectBlockingOnUsageAlarms
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetIsProjectBlockingOnUsageAlarmsOutput'
  /projects/{project_id}/feature_gates:
    get:
      summary: GetProjectFeatureGates
      tags:
      - Projects
      description: 'Get available features for the current project


        ### Required permissions

        > [

        {

        "actions": [

        "role:reader"

        ]

        }

        ]'
      operationId: GetProjectFeatureGates
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectFeatureGatesOutput'
  /projects/streaming-token:
    get:
      summary: GetProjectStreamingToken
      tags:
      - Projects
      description: 'Get a streaming token scoped to the entire project for cross-conversation refresh events.


        ### Required permissions

        > [

        {

        "actions": [

        "agents:read"

        ]

        }

        ]'
      operationId: GetProjectStreamingToken
      parameters: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetProjectStreamingTokenOutput'
  /projects/{project_id}/settings/{setting_id}:
    put:
      summary: UpdateProjectSetting
      tags:
      - Projects
      description: 'Updates a project setting value


        ### Required permissions

        > [

        {

        "actions": [

        "admin"

        ]

        }

        ]'
      operationId: UpdateProjectSetting
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: setting_id
        in: path
        description: ID of setting
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectSettingInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateProjectSettingOutput'
    get:
      summary: GetProjectSetting
      tags:
