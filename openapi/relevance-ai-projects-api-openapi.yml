  /projects/{project_id}/settings:
    post:
      summary: ListProjectSettings
      tags:
      - Projects
      description: 'Lists the values of the requested project settings.


        ### Required permissions

        > [

        {

        "actions": [

        "role:reader"

        ]

        }

        ]'
      operationId: ListProjectSettings
      parameters:
      - name: project_id
        in: path
        description: ID of project
        required: true
        schema:
          type: string
          maxLength: 240
