openapi: 3.2.0
info:
  description: Relevance AI Endpoints
  title: Relevance AI Endpoints Mas Store API
  version: latest
  contact:
    email: dev@tryrelevance.com
servers:
- url: /latest
security:
- AuthorizationHeader:
  - Authorization
tags:
- name: Mas Store
paths:
  /mas-store/items/{document_id}/get:
    get:
      summary: GetMASStore
      tags:
      - Mas Store
      description: '### Required permissions

        > []'
      operationId: GetMASStore
      parameters:
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - in: query
        name: select_fields
        schema:
          type: array
          items:
            type: string
          description: Fields to include in the search results, empty array/list means all fields.
        description: Fields to include in the search results, empty array/list means all fields.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMASStoreOutput'
  /mas-store/items/{document_id}:
    delete:
      summary: DeleteMASStore
      tags:
      - Mas Store
      description: '### Required permissions

        > []'
      operationId: DeleteMASStore
      parameters:
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMASStoreInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMASStoreOutput'
  /mas-store/list:
    post:
      summary: ListMASStore
      tags:
      - Mas Store
      description: '### Required permissions

        > []'
      operationId: ListMASStore
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListMASStoreInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMASStoreOutput'
  /mas-store/items/{document_id}/upsert:
    post:
      summary: UpsertMASStore
      tags:
      - Mas Store
      description: '### Required permissions

        > []'
      operationId: UpsertMASStore
      parameters:
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMASStoreInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertMASStoreOutput'
components:
  schemas:
    ListMASStoreInput:
      type: object
      properties:
        filters:
          type: array
          items:
            type: object
            properties:
              condition:
                type: string
              case_insensitive:
                type: boolean
              field:
                type: string
              filter_type:
                type: string
                enum:
                - exact_match
                - exists
                - ilike
                - regexp
                - ids
                - date
                - numeric
                - or
                - and
                - size
                - array_object_match
              condition_value: {}
        select_fields:
          type: array
          items:
            type: string
          description: Fields to include in the search results, empty array/list means all fields.
        page_size:
          type: integer
          description: Size of each page of results
        page:
          type: integer
          description: Page of the results
        sort:
          type: array
          items:
            oneOf:
            - type: string
            - type: object
              additionalProperties:
                type: string
                enum:
                - asc
                - desc
          description: 'Fields to sort by. For each field, sort by descending or ascending. If you are using descending by datetime, it will get the most recent ones. Can be provided in format ["sortfield","subsortfield"] or in format [{"sortfield":"desc"}, {"subsortfield":"asc"}]. If provided as a query parameter, use: sort=${JSON.stringify([{"sortfield":"desc"}])}'
        include_vector:
          type: boolean
          description: Include vectors in the search results.
        after_id:
          type: array
          items: {}
          description: Retrieve items after these sort values in the sort order.
        query:
          type: string
    UpsertMASStoreInput:
      type: object
      properties:
        data:
          type: object
          properties:
            scratchpad:
              type: object
            node_context:
              type: object
              properties:
                nodes:
                  type: object
            node_outputs:
              type: object
              description: '@deprecated use `node_context` instead'
            source:
              type: object
              additionalProperties:
                type: object
                properties:
                  mapping:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - agent-param
                        - trigger-type
                        - tool-input
                        - agent-input
                        - agent-output
                        - tool-output
                      id:
                        type: string
                      field:
                        type: string
                      agent_id:
                        type: string
                      chain_id:
                        type: string
                      source:
                        type: string
                        enum:
                        - input
                        - output
                        - setting
                    required:
                    - field
            custom_metadata:
              type: array
              items:
                type: object
                properties:
                  title:
                    type: string
                  value:
                    oneOf:
                    - type: number
                    - type: string
                    - type: boolean
                    - type: array
                      items:
                        type: string
                  agent_id:
                    type: string
                required:
                - title
            mas_id:
              type: string
            created_by_user_id:
              type: string
            creation_surface:
              type: string
              enum:
              - inventor
              - mcp
              - builder_ui
              - chat
              - direct_api
              description: 'How the resource was created: inventor / mcp / builder_ui / chat / direct_api.'
            workforce_task_metadata:
              type: object
              properties:
