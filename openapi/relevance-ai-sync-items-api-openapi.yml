openapi: 3.2.0
info:
  description: Relevance AI Endpoints
  title: Relevance AI Endpoints Sync Items API
  version: latest
  contact:
    email: dev@tryrelevance.com
servers:
- url: /latest
security:
- AuthorizationHeader:
  - Authorization
tags:
- name: Sync Items
paths:
  /sync-items/collections/{collection_id}/items/{document_id}/get:
    get:
      summary: GetSyncItems
      tags:
      - Sync Items
      description: '### Required permissions

        > []'
      operationId: GetSyncItems
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - in: query
        name: select_fields
        schema:
          type: array
          items:
            type: string
          description: Fields to include in the search results, empty array/list means all fields.
        description: Fields to include in the search results, empty array/list means all fields.
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSyncItemsOutput'
  /sync-items/collections/{collection_id}/items/{document_id}:
    delete:
      summary: DeleteSyncItems
      tags:
      - Sync Items
      description: '### Required permissions

        > []'
      operationId: DeleteSyncItems
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteSyncItemsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteSyncItemsOutput'
  /sync-items/collections/{collection_id}/list:
    post:
      summary: ListSyncItems
      tags:
      - Sync Items
      description: '### Required permissions

        > []'
      operationId: ListSyncItems
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSyncItemsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSyncItemsOutput'
  /sync-items/collections/{collection_id}/items/{document_id}/upsert:
    post:
      summary: UpsertSyncItems
      tags:
      - Sync Items
      description: '### Required permissions

        > []'
      operationId: UpsertSyncItems
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertSyncItemsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertSyncItemsOutput'
  /sync-items/collections/{collection_id}/items/{document_id}/trigger:
    post:
      summary: TriggerSyncItem
      tags:
      - Sync Items
      description: 'Trigger only a specific item for a Sync


        ### Required permissions

        > []'
      operationId: TriggerSyncItem
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerSyncItemInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerSyncItemOutput'
  /sync-items/collections/{collection_id}/items/{document_id}/update_status:
    post:
      summary: UpdateSyncItemStatus
      tags:
      - Sync Items
      description: 'Updates sync item''s status


        ### Required permissions

        > []'
      operationId: UpdateSyncItemStatus
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSyncItemStatusInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSyncItemStatusOutput'
  /sync-items/collections/{collection_id}/items/{document_id}/fields/update:
    put:
      summary: UpdateSelectedSyncItemFields
      tags:
      - Sync Items
      description: 'Updates sync item


        ### Required permissions

        > [

        {

        "actions": [

        "agents:write"

        ]

        }

        ]'
      operationId: UpdateSelectedSyncItemFields
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - name: document_id
        in: path
        description: ID of document
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSelectedSyncItemFieldsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSelectedSyncItemFieldsOutput'
  /sync-items/collections/{collection_id}/bulk/postpone:
    put:
      summary: BulkPostponeUpcomingSyncItems
      tags:
      - Sync Items
      description: 'Bulk updates the execution date of upcoming sync items


        ### Required permissions

        > [

        {

        "actions": [

        "agents:write"

        ]

        }

        ]'
      operationId: BulkPostponeUpcomingSyncItems
      parameters:
      - name: collection_id
        in: path
        description: ID of collection
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPostponeUpcomingSyncItemsInput'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPostponeUpcomingSyncItemsOutput'
components:
  schemas:
    UpdateSelectedSyncItemFieldsOutput: {}
    GetSyncItemsOutput:
      type: object
      properties:
        insert_date_:
          type: string
        update_date:
          type: string
        expiry_date_: {}
        project:
          type: string
        _id:
          type: string
        feature:
          type: string
        collection_id:
          type: string
        document_id:
          type: string
        data:
          type: object
          properties:
            record:
              type: object
              properties:
                raw_data: {}
              additionalProperties: true
            sync_config_snapshot:
              type: object
              oneOf:
              - type: object
                properties:
                  type:
                    type: string
                  gmail:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      include_labels:
                        type: array
                        items:
                          type: string
                      exclude_emails:
                        type: array
                        items:
                          type: string
                      is_outreach_reply_only:
                        type: boolean
                        default: false
                      is_attachments_enabled:
                        type: boolean
                        default: false
                      recently_processed_ids:
                        type: array
                        items:
                          type: object
                          properties:
                            gmail_id:
                              type: string
                          required:
                          - gmail_id
                          additionalProperties: false
                      search:
                        type: string
                      thread_id_mapping:
                        type: string
                    required:
                    - oauth_account_id
                    additionalProperties: true
                required:
                - type
                - gmail
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  google_calendar:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      calendar_id:
                        type: string
                      events:
                        type: object
                        properties:
                          updated_min_date:
                            type: string
                            description: Lower bound for event's last modification time (as a RFC3339 timestamp) to filter by.
                          notifications:
                            type: array
                            items:
                              type: object
                              properties:
                                timeOffset:
                                  type: object
                                  oneOf:
                                  - properties:
                                      unit:
                                        type: string
                                        enum:
                                        - minutes
                                      quantity:
                                        type: integer
                                        minimum: 0
                                        maximum: 1440
                                      direction:
                                        type: string
                                        enum:
                                        - before
                                        - after
                                    required:
                                    - unit
                                    - quantity
                                    - direction
                                  - properties:
                                      unit:
                                        type: string
                                        enum:
                                        - hours
                                      quantity:
                                        type: integer
                                        minimum: 0
                                        maximum: 24
                                      direction:
                                        type: string
                                        enum:
                                        - before
                                        - after
                                    required:
                                    - unit
                                    - quantity
                                    - direction
                                  - properties:
                                      unit:
                                        type: string
                                        enum:
                                        - days
                                      quantity:
                                        type: integer
                                        minimum: 0
                                        maximum: 365
                                      direction:
                                        type: string
                                        enum:
                                        - before
                                        - after
                                    required:
                                    - unit
                                    - quantity
                                    - direction
                                message:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - raw
                                      - custom
                                      description: Type of the message
                                    content:
                                      type: string
                                      description: Custom message content (optional if type is 'Whole payload')
                                  required:
                                  - type
                                  additionalProperties: false
                              required:
                              - timeOffset
                              - message
                              additionalProperties: false
                            description: An array of notifications
                        required:
                        - notifications
                    required:
                    - oauth_account_id
                    - oauth_account_label
                    - calendar_id
                    - events
                    additionalProperties: true
                required:
                - type
                - google_calendar
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  teams_calendar:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      calendar_id:
                        type: string
                      events:
                        type: object
                        properties:
                          updated_min_date:
                            type: string
                            description: Lower bound for event's last modification time (as a RFC3339 timestamp) to filter by.
                          watched_sensitivities:
                            type: array
                            items:
                              type: string
                              enum:
                              - normal
                              - private
                            description: Which Microsoft Graph event sensitivity levels should trigger the agent or workforce. Omit to watch every event (the default). The UI pre-selects all levels; removing one (e.g. 'private') stops events of that sensitivity from triggering. An empty array watches nothing.
                          notifications:
                            type: array
                            items:
                              type: object
                              properties:
                                timeOffset:
                                  type: object
                                  oneOf:
                                  - properties:
                                      unit:
                                        type: string
                                        enum:
                                        - minutes
                                      quantity:
                                        type: integer
                                        minimum: 0
                                        maximum: 1440
                                      direction:
                                        type: string
                                        enum:
                                        - before
                                        - after
                                    required:
                                    - unit
                                    - quantity
                                    - direction
                                  - properties:
                                      unit:
                                        type: string
                                        enum:
                                        - hours
                                      quantity:
                                        type: integer
                                        minimum: 0
                                        maximum: 24
                                      direction:
                                        type: string
                                        enum:
                                        - before
                                        - after
                                    required:
                                    - unit
                                    - quantity
                                    - direction
                                  - properties:
                                      unit:
                                        type: string
                                        enum:
                                        - days
                                      quantity:
                                        type: integer
                                        minimum: 0
                                        maximum: 365
                                      direction:
                                        type: string
                                        enum:
                                        - before
                                        - after
                                    required:
                                    - unit
                                    - quantity
                                    - direction
                                message:
                                  type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - raw
                                      - custom
                                      description: Type of the message
                                    content:
                                      type: string
                                      description: Custom message content (optional if type is 'Whole payload')
                                  required:
                                  - type
                                  additionalProperties: false
                              required:
                              - timeOffset
                              - message
                              additionalProperties: false
                            description: An array of notifications
                    required:
                    - oauth_account_id
                    - oauth_account_label
                    - calendar_id
                    - events
                    additionalProperties: true
                required:
                - type
                - teams_calendar
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  outlook:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      exclude_emails:
                        type: array
                        items:
                          type: string
                      is_outreach_reply_only:
                        type: boolean
                        default: false
                      is_attachments_enabled:
                        type: boolean
                        default: false
                      recently_processed_ids:
                        type: array
                        items:
                          type: object
                          properties:
                            outlook_id:
                              type: string
                          required:
                          - outlook_id
                          additionalProperties: false
                      search:
                        type: string
                      thread_id_mapping:
                        type: string
                    required:
                    - oauth_account_id
                    additionalProperties: true
                required:
                - type
                - outlook
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  hubspot:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      include_labels:
                        type: array
                        items:
                          type: string
                      exclude_labels:
                        type: array
                        items:
                          type: string
                      labels:
                        type: array
                        items:
                          type: string
                      search:
                        type: string
                    additionalProperties: true
                required:
                - type
                - hubspot
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  unipile:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      provider_user_id:
                        type: string
                      is_outreach_reply_only:
                        type: boolean
                        default: false
                    required:
                    - oauth_account_id
                    - oauth_account_label
                    - provider_user_id
                    additionalProperties: true
                required:
                - type
                - unipile
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  unipile:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      provider_user_id:
                        type: string
                      is_outreach_reply_only:
                        type: boolean
                        default: false
                    required:
                    - oauth_account_id
                    - oauth_account_label
                    - provider_user_id
                    additionalProperties: true
                required:
                - type
                - unipile
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  unipile:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      provider_user_id:
                        type: string
                      is_outreach_reply_only:
                        type: boolean
                        default: false
                    required:
                    - oauth_account_id
                    - oauth_account_label
                    - provider_user_id
                    additionalProperties: true
                required:
                - type
                - unipile
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  whatsapp:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      whatsapp_business_account_id:
                        type: string
                    required:
                    - whatsapp_business_account_id
                    additionalProperties: true
                required:
                - type
                - whatsapp
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  relevance_meeting_bot:
                    type: object
                    properties:
                      bot_id:
                        type: string
                    additionalProperties: true
                required:
                - type
                - relevance_meeting_bot
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  freshdesk:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                        description: DEPRECATED
                      whitelist:
                        type: array
                        items:
                          type: object
                          properties:
                            source_object:
                              type: string
                              enum:
                              - ticket
                              default: ticket
                            source_properties:
                              type: array
                              items:
                                type: object
                                properties:
                                  field_name:
                                    type: string
                                  whitelist_values:
                                    type: array
                                    items: {}
                                required:
                                - field_name
                                - whitelist_values
                                additionalProperties: false
                          required:
                          - source_object
                          - source_properties
                          additionalProperties: false
                    additionalProperties: false
                required:
                - type
                - freshdesk
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  salesforce:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                      oauth_account_label:
                        type: string
                      salesforce_query:
                        type: string
                      last_processed_message_date_utc:
                        type: string
                      page_size:
                        type: number
                        default: 1000
                      sync_interval:
                        type: string
                        enum:
                        - minutely
                        - hourly
                        - daily
                        default: minutely
                      last_sync_date_utc:
                        type: string
                      dedupe_field:
                        type: string
                        enum:
                        - Email
                        - None
                        - Disabled
                      mapping:
                        type: object
                        properties:
                          unique_id:
                            type: string
                            description: jq path to unique input field for idempotency
                          thread_id:
                            type: string
                            description: jq path to input field for conversation threading
                        additionalProperties: false
                      task_creation_mode:
                        type: string
                        enum:
                        - existing_tasks_only
                        - new_and_existing_tasks
                        description: The task creation mode controls how tasks are created and appended to.
                    required:
                    - oauth_account_id
                    - salesforce_query
                    additionalProperties: false
                required:
                - type
                - salesforce
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  zoominfo:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                        description: DEPRECATED
                      intent_topics:
                        type: array
                        items:
                          type: string
                      signal_score_min:
                        enum:
                        - 80
                        - 90
                        - 95
                        - 99
                        type: number
                      audience_strength_min:
                        enum:
                        - A
                        - B
                        - C
                        type: string
                      company_country:
                        type: string
                      company_annual_revenue_min_usd:
                        type: number
                      company_annual_revenue_max_usd:
                        type: number
                      employee_count_min:
                        type: number
                      employee_count_max:
                        type: number
                      industry_codes:
                        type: array
                        items:
                          type: string
                      next_page_number:
                        type: number
                        description: The page number to start the intent search from
                      max_results_per_ingestion:
                        type: number
                        description: The maximum number of results to return per ingestion
                    required:
                    - intent_topics
                    - signal_score_min
                    - audience_strength_min
                    - company_country
                    - next_page_number
                    additionalProperties: false
                required:
                - type
                - zoominfo
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  webhook:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                        description: DEPRECATED
                      message_template:
                        type: string
                        minLength: 1
                    additionalProperties: false
                required:
                - type
                - webhook
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  custom_webhook:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                        description: Right now this is mandatory due to frontend design for all syncs but should'nt be
                      webhook_name:
                        type: string
                        description: Name of the webhook
                      webhook_description:
                        type: string
                        description: Description of the webhook
                      mapping:
                        type: object
                        properties:
                          unique_id:
                            type: string
                            description: jq path to unique input field for idempotency
                          thread_id:
                            type: string
                            description: jq path to input field for conversation threading
                        additionalProperties: false
                      message_template:
                        type: string
                        description: 'template to substitute input fields for custom agent trigger message e.g. ''New message: {{data.body}}'''
                    required:
                    - mapping
                    - message_template
                    additionalProperties: false
                required:
                - type
                - custom_webhook
                additionalProperties: false
              - type: object
                properties:
                  type:
                    type: string
                  recurring:
                    type: object
                    properties:
                      oauth_account_id:
                        type: string
                        description: Right now this is mandatory due to frontend design for all syncs but should'nt be
                      sync_id:
                        type: string
                        description: The trigger id of the scheduled recurrence
                      name:
                        type: string
                        description: Name of the scheduled recurrence
                      message:
                        type: string
                        description: Instruction of the scheduled recurrence
                      schedule:
                        type: object
                        properties:
                          frequency:
                            type: string
                            enum:
                            - daily
                            - weekly
                            - monthly
                            - annually
                            - no_repeat
                            - hourly
                            - minutely
                            - custom_cron
                          month:
                            type: string
                            enum:
                            - january
                            - february
                            - march
                            - april
                            - may
                            - june
                            - july
                            - august
                            - september
                            - october
                            - november
                            - december
                            description: Month of the year. Required for annually schedules.
                          day_of_week:
                            type: string
                            enum:
                            - mon
                            - tue
                            - wed
                            - thu
                            - fri
                            - sat
                            - sun
                            description: Day of the week. Required for weekly schedules.
                          day_of_month:
                            type: string
                            description: Day of the month (1-31). Required for monthly and annually schedules. Also accepts 'last_day' for the last day of the month (e.g. Feb ends 28)
                          hour:
                            type: string
                            description: Time of day in HH:mm. Required for every frequency except custom_cron (including minutely and hourly).
                          date:
                            type: string
                            description: Specific date in YYYY-MM-DD format (must be in the future). Required for no_repeat schedules.
                          timezone:
                            type: string
                            description: IANA timezone string (e.g. 'Australia/Sydney'). Required for every frequency except custom_cron.
                          minute_interval:
                            type: string
                            description: For running every n minutes. Must be at least 10. Required for minutely schedules.
                          hour_interval:
                            type: string
                            description: For running every n hours. Must be at least 1. Required for hourly schedules.
                          cron_expression:
                            type: string
                            description: 'Custom 6-field cron expression (e.g., ''0 12 * * ? *''). Required when frequency is ''custom_cron''. Note: Minute intervals must be at least 10 minutes.'
                        required:
