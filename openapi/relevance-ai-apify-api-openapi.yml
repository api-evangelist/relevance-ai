openapi: 3.2.0
info:
  description: Relevance AI Endpoints
  title: Relevance AI Endpoints Apify API
  version: latest
  contact:
    email: dev@tryrelevance.com
servers:
- url: /latest
security:
- AuthorizationHeader:
  - Authorization
tags:
- name: apify
paths:
  /apify/actors:
    get:
      summary: GetApifyActors
      tags:
      - apify
      description: 'Get all available Apify actors with pagination and search


        ### Required permissions

        > []'
      operationId: GetApifyActors
      parameters:
      - in: query
        name: page
        schema:
          type: number
          minimum: 1
          default: 1
        description: ''
      - in: query
        name: page_size
        schema:
          type: number
          minimum: 1
          maximum: 100
          default: 20
        description: ''
      - in: query
        name: search
        schema:
          type: string
          description: Search term to filter actors by actor_id, title, or description (case-insensitive)
        description: Search term to filter actors by actor_id, title, or description (case-insensitive)
      - in: query
        name: category
        schema:
          type: string
          enum:
          - AI
          - AGENTS
          - AUTOMATION
          - BUSINESS
          - COVID_19
          - DEVELOPER_EXAMPLES
          - DEVELOPER_TOOLS
          - ECOMMERCE
          - FOR_CREATORS
          - GAMES
          - JOBS
          - LEAD_GENERATION
          - MARKETING
          - NEWS
          - SEO_TOOLS
          - SOCIAL_MEDIA
          - TRAVEL
          - VIDEOS
          - REAL_ESTATE
          - SPORTS
          - EDUCATION
          - INTEGRATIONS
          - OTHER
          - OPEN_SOURCE
          - MCP_SERVERS
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApifyActorsOutput'
  /apify/actors/schema:
    get:
      summary: GetApifyActorSchema
      tags:
      - apify
      description: 'Get input schema for a specific Apify actor


        ### Required permissions

        > []'
      operationId: GetApifyActorSchema
      parameters:
      - in: query
        name: actor_id
        schema:
          type: string
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetApifyActorSchemaOutput'
components:
  schemas:
    GetApifyActorsOutput:
      type: object
      properties:
        total_count:
          type: number
        page:
          type: number
        page_size:
          type: number
        total_pages:
          type: number
        actors:
          type: array
          items:
            type: object
            properties:
              actor_id:
                type: string
              name:
                type: string
              username:
                type: string
              title:
                type: string
              description:
                type: string
              icon_url:
                type: string
            required:
            - actor_id
            - name
            - username
            - title
            - description
            additionalProperties: false
      required:
      - total_count
      - page
      - page_size
      - total_pages
      - actors
      additionalProperties: false
    GetApifyActorSchemaOutput:
      type: object
      properties:
        input_schema: {}
      required:
      - input_schema
      additionalProperties: false
  securitySchemes:
    AuthorizationHeader:
      type: apiKey
      in: header
      name: Authorization
      description: 'Authorization credentials. Header authorization should be in the form of: project:api_key'
