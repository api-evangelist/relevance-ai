components:
  schemas:
    BuyCreditsInput:
      type: object
      properties:
        quantity:
          type: number
          minimum: 10000
        idempotency_key:
          type: string
      required:
      - idempotency_key
      - quantity
      additionalProperties: false
    AggregateToolsCreditsUsedInput:
      type: object
      properties:
        start_date:
          type: string
        end_date:
          type: string
      additionalProperties: false
    UpsertAutoRechargeConfigOutput:
      type: object
      properties:
        threshold:
          type: number
        amount:
          type: number
      required:
      - threshold
      - amount
      additionalProperties: false
    AggregateToolsCreditsUsedOutput:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              project_id:
                type: string
              description:
                type: string
              emoji:
                type: string
              credits_used:
                type: number
              actions_used:
                type: number
              metadata:
                type: object
                properties:
                  last_run_date:
                    type: string
                additionalProperties: false
              studio_id:
                type: string
              title:
                type: string
              is_linkable:
                type: boolean
            additionalProperties: false
            required:
            - project_id
            - credits_used
            - studio_id
            - title
            - is_linkable
        total_credits:
          type: number
        total_actions:
          type: number
      required:
      - results
      - total_credits
      additionalProperties: false
    ChangeBillingSubscriptionOutput:
      type: object
      properties:
        client_secret:
          type: string
        checkout_session_id:
          type: string
      required:
      - client_secret
      - checkout_session_id
    SyncSubscriptionInput: {}
    DowngradeSubscriptionInput:
      type: object
      properties:
        plan:
          type: string
          enum:
          - free
          - basic
          - starter
          - team
          - business
          - enterprise
          - custom
        billing_cycle:
          type: string
          enum:
          - monthly
          - yearly
          description: The billing cycle of a Stripe subscription plan
        idempotency_key:
          type: string
        feedback:
          type: object
          properties:
            reason:
              type: string
              enum:
              - too-expensive
              - price-increase
              - low-usage
              - missing-features
              - integration-issues
              - switching-tool
              - support-issues
              - no-longer-needed
              - other
              description: The reason for the billing change
            explanation:
              type: string
              description: Additional explanation for the billing change
          required:
          - reason
          additionalProperties: false
      required:
      - idempotency_key
      - plan
      additionalProperties: false
    DowngradeSubscriptionOutput:
      type: object
      properties: {}
      additionalProperties: false
    GetBillingTotalsOutput:
      type: object
      properties:
        total_cost:
          type: number
      required:
      - total_cost
      additionalProperties: false
    GetAutoRechargeConfigOutput:
      type: object
      properties:
        config:
          oneOf:
          - type: object
            properties:
              threshold:
                type: number
              amount:
                type: number
            required:
            - threshold
            - amount
            additionalProperties: false
          - type: 'null'
      required:
      - config
      additionalProperties: false
    CancelDowngradeOutput:
      type: object
      properties: {}
      additionalProperties: false
    CancelSubscriptionInput:
      type: object
      properties:
        idempotency_key:
          type: string
    UpdateOverageConfigInput:
      type: object
      properties:
        credits:
          type: object
          properties:
            enabled:
              type: boolean
          required:
          - enabled
          additionalProperties: false
        actions:
          type: object
          properties:
            enabled:
              type: boolean
          required:
          - enabled
          additionalProperties: false
        concurrency:
          type: object
          properties:
            enabled:
              type: boolean
          required:
          - enabled
          additionalProperties: false
      additionalProperties: false
    BuyCreditsOutput:
      type: object
      properties: {}
      additionalProperties: false
    GetBillingFrontendLinkOutput:
      type: object
      properties:
        link:
          type: string
      required:
      - link
      additionalProperties: false
    AggregateAgentsCreditsUsedOutput:
      type: object
      properties:
        results:
