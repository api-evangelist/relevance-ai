  /organizations/{organization_id}/billing/totals:
    get:
      summary: GetBillingTotals
      tags:
      - Billing
      description: 'Gets total cost over a date range from billing events


        ### Required permissions

        > [

        {

        "actions": [

        "organizations:write"

        ],

        "organizations": [

        {

        "params": "organization_id"

        }

        ]

        }

        ]'
      operationId: GetBillingTotals
      parameters:
      - name: organization_id
        in: path
        description: ID of organization
        required: true
        schema:
          type: string
          maxLength: 240
          pattern: ^[a-zd._-]+$
      - in: query
        name: date_range
        schema:
          type: string
          enum:
          - week
          - month
          - three_months
          - six_months
        description: ''
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetBillingTotalsOutput'
