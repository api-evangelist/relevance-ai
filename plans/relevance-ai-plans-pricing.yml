specification: API Commons Plans
specificationVersion: '0.1'
generated: '2026-08-29'
method: searched
source: https://relevanceai.com/docs/get-started/pricing
provider: Relevance AI
providerId: relevance-ai
created: '2026-05-04'
modified: '2026-08-29'
currency: USD
tags:
  - AI Agents
  - AI Automation
description: >-
  Relevance AI's published plan tiers, read from the provider's own pricing reference. Billing
  is metered on two separate units: an Action (one run of a Tool, charged whether or not it
  succeeds) and a Vendor Credit (the wholesale cost of the underlying LLM or tool call, passed
  through with no markup). Subscriptions are applied at the Organization level, not per user.
  This file REPLACES a 2026-05-04 scaffold that carried invented tier limits.
billing_units:
  - name: Action
    definition: >-
      A single run of a Tool — whether a one-step task or a many-step workflow. A failed tool
      run still counts as one Action.
    reset: Plan Actions reset to the plan default at each renewal; purchased top-ups roll over.
  - name: Vendor Credit
    definition: >-
      The cost of the AI model and tool usage, at wholesale with no markup. Bring-your-own API
      keys bypasses Vendor Credits entirely (paid plans only).
    reset: Roll over indefinitely while subscribed.
plans:
  - id: free
    name: Free
    price: '0'
    currency: USD
    period: month
    self_serve: true
    credit_card_required: false
    included:
      actions_per_month: 200
      vendor_credits: 1000
      vendor_credits_note: One-time allocation at signup; does not renew.
      build_users: 1
      end_users: 0
      shared_projects: 1
      workforces: 1
      agents: unlimited
      tools: unlimited
      integrations: unlimited
      task_history_days: 30
      concurrent_agent_tasks: 'Less (tier-relative; absolute number not published)'
    features:
      - Marketplace access
      - Community forum
      - SOC 2 and GDPR compliance
    excludes:
      - Scheduled task triggers
      - Escalations
      - Bring your own LLM
      - Top-up purchases
  - id: pro
    name: Pro
    price: '19'
    price_monthly_billed_monthly: '29'
    currency: USD
    period: month
    billing_note: '$19/month billed annually, $29/month billed monthly (annual saves 33%).'
    self_serve: true
    included:
      actions_per_month: 2500
      actions_per_year: 30000
      vendor_credits_per_month: 10000
      vendor_credits_usd_per_year: 240
      build_users: 2
      end_users: 0
      shared_projects: 1
      workforces: unlimited
      task_history_days: 90
      concurrent_agent_tasks: 'Standard (tier-relative; absolute number not published)'
    features:
      - Scheduled tasks
      - Chat mode
      - Smart escalations (Email and Slack)
      - Activity Center
      - Premium app triggers (WhatsApp, LinkedIn, Telegram)
      - Bring your own LLM
      - A/B testing
  - id: team
    name: Team
    price: '234'
    price_monthly_billed_monthly: '349'
    currency: USD
    period: month
    billing_note: '$234/month billed annually, $349/month billed monthly (annual saves 33%).'
    self_serve: true
    included:
      actions_per_month: 7000
      actions_per_year: 84000
      vendor_credits_per_month: 35000
      vendor_credits_usd_per_year: 840
      build_users: 5
      end_users: 45
      shared_projects: 5
      task_history_days: 90
      concurrent_agent_tasks: 'More (tier-relative; absolute number not published)'
    features:
      - Everything in Pro
      - Unused credits rollover
      - Calling and meeting agents
      - Analytics dashboard
      - Priority support
  - id: enterprise
    name: Enterprise
    price: custom
    currency: USD
    period: custom
    self_serve: false
    contact: https://relevanceai.com/book-a-demo
    included:
      actions_per_month: custom
      vendor_credits: custom
      build_users: unlimited
      end_users: unlimited
      shared_projects: unlimited
      task_history_days: custom
      concurrent_agent_tasks: custom
    features:
      - Everything in Team
      - Enterprise app triggers (Salesforce, Snowflake, Zendesk)
      - Agent evaluations
      - Work hour controls
      - Multi-org management
      - SSO (SAML), RBAC, audit logs
      - Data retention policies
      - OTEL event streaming to your own S3 bucket
      - PII redaction and prompt-injection detection
      - Dedicated account manager and custom implementation
      - 99.9% uptime SLA
add_ons:
  - id: actions-topup
    name: Extra Actions
    price: '80'
    currency: USD
    unit: 1000 Actions
    increment: 1000
    availability: paid plans only
    rollover: rolls over to the next billing cycle
  - id: vendor-credits-topup
    name: Extra Vendor Credits
    price: '20'
    currency: USD
    unit: 10000 Vendor Credits
    increment: 10000
    availability: paid plans only
    rollover: rolls over indefinitely while subscribed
plan_count: 4
notes:
  - >-
    The marketing pricing page at https://relevanceai.com/pricing currently renders only the
    Enterprise "Talk to sales" card; the full four-tier table with prices lives in the docs at
    /docs/get-started/pricing. The docs page is the source used here.
  - >-
    Concurrency limits are the one quota the provider describes only relatively
    ("Less / Standard / More / Custom"). No absolute concurrent-task number is published for
    any tier, so none is recorded.
  - >-
    In September 2025 the provider split a single "Credits" unit into Actions and Vendor
    Credits and migrated all customers. Any integration reading pre-September-2025 credit
    figures is reading a retired unit.
