  - aid: relevance-ai:relevance-ai-mcp
    name: Relevance AI MCP Server
    description: >-
      First-party hosted MCP server exposing a Relevance AI project's agents, tools,
      workforces, knowledge tables, evals, analytics, folders and triggers to any
      MCP-compatible client (Claude, ChatGPT, Cursor, VS Code, Codex, Windsurf, Zed and
      others). Streamable HTTP transport behind OAuth 2.0 with PKCE and dynamic client
      registration; a session binds to one project and is bounded server-side by the caller's
      project role, with an opt-in Run-Only mode that strips write and destructive tools.
    humanURL: https://relevanceai.com/docs/integrations/mcp/mcp-server
