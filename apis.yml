apis:
  - aid: relevance-ai:relevance-ai
    name: Relevance AI API
    description: >-
      REST API for the Relevance AI agent platform — 521 paths and 566 operations covering
      agents, tools (called "studios" in the API), multi-agent workforces, knowledge tables,
      conversations, triggers, evals, analytics, the template marketplace, projects,
      organizations and billing. Authenticated with an `Authorization: project:api_key`
      header. Served from a regional host chosen at client construction:
      api-bcbe5a (US), api-d7b62b (EU) or api-f1db6c (AU).
    humanURL: https://api-f1db6c.stack.tryrelevance.com/latest/documentation
    baseURL: https://api-{region}.stack.tryrelevance.com/latest
