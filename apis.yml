aid: relevance-ai
name: Relevance AI
description: >-
  Relevance AI is an agent platform for building, testing and running specialist AI agents and
  multi-agent "workforces" — teams of agents that coordinate on a shared goal. Domain experts
  build agents in a no-code visual builder, hold them to pass/fail quality bars with a built-in
  evals system, and connect them to 1,000+ integrations across sales, marketing, customer
  success, operations and HR. Developers reach the same platform three ways: a 566-operation
  REST API served from regional hosts in the US, EU and Australia; a first-party
  JavaScript/TypeScript SDK on npm and JSR; and a hosted, OAuth-protected MCP server at
  mcp.relevanceai.com that exposes agents, tools, workforces, knowledge tables, evals and
  analytics to any MCP client. Enterprise governance covers RBAC, human-in-the-loop approvals,
  SSO/SAML, PII masking, version control with rollback, multi-region data residency, and
  OpenTelemetry audit-log and trace streaming to the customer's own S3 bucket. Operated by
  OnSearch Pty Ltd T/A Relevance AI; SOC 2 Type II and GDPR compliant.
type: Index
